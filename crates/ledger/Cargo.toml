[package]
name = "graham-ledger"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
age = { version = "=0.12.1", default-features = false }
chrono = "0.4"
chrono-tz = "=0.10.4"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
